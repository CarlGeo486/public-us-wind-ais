<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIS - active vessels</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0b1416;
      font-family: monospace
    }

    #map {
      position: absolute;
      inset: 0
    }

    #hud {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(8, 18, 22, .85);
      color: #cfeee2;
      padding: 10px 14px;
      border: 1px solid #2c4a42;
      border-radius: 6px;
      font-size: 13px
    }

    #hud b {
      color: #37e8a0
    }

    .leaflet-tooltip.ves-label {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      margin: 0;
      color: #9fdfc8;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
    }

    .leaflet-tooltip.ves-label::before {
      display: none;
    }

    .leaflet-popup-content {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .leaflet-popup-content b {
      color: #0b6b4f;
    }

    .leaflet-tooltip.wtg-label {
      color: #ff9f43;
    }

    #disclaimer-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 10, 12, 0.93);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #disclaimer-box {
      background: #081216;
      border: 1px solid #ff5252;
      padding: 24px;
      max-width: 440px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    #disclaimer-box p {
      color: #cfeee2;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 20px 0;
    }

    #ack-btn {
      background: #37e8a0;
      color: #0b1416;
      border: none;
      padding: 10px 20px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }

    #ack-btn:hover {
      background: #29c788;
    }

    /* ===== project layers control (PIN-gated DB layers) ===== */
    #proj {
      position: absolute;
      top: 58px;
      right: 12px;
      z-index: 1000;
      background: rgba(8, 18, 22, .85);
      color: #cfeee2;
      padding: 10px 12px;
      border: 1px solid #2c4a42;
      border-radius: 6px;
      font-size: 12px;
      max-width: 230px;
    }

    #proj button {
      background: #1d3b34;
      color: #cfeee2;
      border: 1px solid #2c4a42;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }

    #proj button:hover {
      background: #234a41;
    }

    #proj input {
      width: 100%;
      box-sizing: border-box;
      background: #050d10;
      color: #cfeee2;
      border: 1px solid #2c4a42;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    #proj-msg {
      margin-top: 6px;
      color: #9fdfc8;
      min-height: 1em;
    }

    #proj-msg.err {
      color: #ff7a7a;
    }

    .cable-legend {
      background: rgba(8, 18, 22, .85);
      color: #cfeee2;
      padding: 8px 12px;
      border: 1px solid #2c4a42;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      line-height: 1.5;
    }

    .cable-legend .title {
      color: #37e8a0;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 4px;
      font-size: 10px;
    }

    .cable-legend .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 2px 0;
    }

    .cable-legend .sw {
      display: inline-block;
      width: 24px;
      border-radius: 1px;
    }
  </style>
</head>

<body>
  <div id="disclaimer-overlay">
    <div id="disclaimer-box">
      <p>This is a hobby project that was put together over a few free nights. This sources a variety of AIS open data
        projects from unknown authors and should not be relied on by anyone for any purpose anywhere.</p>
      <button id="ack-btn" onclick="acknowledgeDisclaimer()">I Acknowledge</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="hud"><b id="count">0</b> vessels &middot; <span id="status">loading...</span></div>

  <div id="right-panel">
    <div id="proj">
      <button id="proj-toggle" onclick="showProjPrompt()">Load project layers</button>
      <div id="proj-form" style="display:none;">
        <input id="proj-pw" type="password" placeholder="project password" autocomplete="off"
          onkeydown="if(event.key==='Enter')loadProjectLayers()">
        <button onclick="loadProjectLayers()">Show towers &amp; cables</button>
      </div>
      <div id="proj-msg"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="sunrise-wtg-locations.js"></script>
  <script>
    // ===== CONFIG — every tunable lives here =====================================
    // Data source: flip USE_BUCKET to choose where vessel data comes from.
    //   false -> the local server (for dev, or an SSH tunnel to the VM)
    //   true  -> the public GCS bucket the VM publishes to (for GitHub Pages)
    var USE_BUCKET = true;
    var LOCAL_URL = "http://localhost:8080/vessels";
    var BUCKET_URL = "https://storage.googleapis.com/wind-public-data-e37f6aaf3ba4/vessels.json";
    var DATA_URL = USE_BUCKET ? BUCKET_URL : LOCAL_URL;

    var REFRESH_MS = 10000;                     // poll every 10 seconds
    var TARGETS = [367194000, 210739000];       // highlighted MMSIs — keep in sync with WATCHED in server.js
    var STALE_MS = 3600000;                     // strike through names older than 1 hour

    // AOI — keep in sync with BBOX in server.js. Leaflet bounds = [[S,W],[N,E]].
    var AOI = [[40.5, -73.0], [42.0, -70.0]];

    // ===== MAP + STATIC LAYERS ===================================================
    var map = L.map('map');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2w8k_1_818df9fdbb6a38cd7437f870',
      { attribution: 'OpenStreetMap, CARTO', maxZoom: 19 }).addTo(map);

    // faint AOI outline, below the markers
    L.rectangle(AOI, { color: '#37e8a0', weight: 1, opacity: 0.25, fill: false, dashArray: '4 6', interactive: false }).addTo(map);
    map.setView([41.0, -71.1], 11); // [Latitude, Longitude], Zoom Level

    // Render the inlined wind farm layout dataset directly. Grouped so it can be
    // swapped out for the project layers once those load.
    var publicWtgLayer = L.layerGroup().addTo(map);

    L.geoJSON(SUNRISE_GEOJSON, {
      pointToLayer: function (feature, latlng) {
        var isStation = feature.properties.type !== 'WTG';
        var clr = isStation ? '#ff5252' : '#ff9f43';

        // Every asset is a stationary structure—give it a 150m ring
        L.circle(latlng, { radius: 150, color: clr, weight: 0.8, dashArray: '4 4', fillOpacity: 0.03, interactive: false }).addTo(publicWtgLayer);

        return L.circleMarker(latlng, {
          radius: isStation ? 6 : 3,
          color: clr,
          weight: 1,
          fillColor: clr,
          fillOpacity: 0.7
        });
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup('<b>Layout ID: ' + feature.properties.name + '</b><br>Type: ' + feature.properties.type);
        layer.bindTooltip(feature.properties.name, { permanent: true, direction: 'top', offset: [0, -3], className: 'ves-label wtg-label' });
      }
    }).addTo(publicWtgLayer);

    // Legend for the project cable layer — only added to the map once cables render.
    var cableLegend = L.control({ position: 'bottomleft' });
    cableLegend.onAdd = function () {
      var div = L.DomUtil.create('div', 'cable-legend');
      div.innerHTML =
        '<div class="title">CABLES</div>' +
        '<div class="row"><span class="sw" style="background:#ff5252; height:3px"></span>800mm&sup2;</div>' +
        '<div class="row"><span class="sw" style="background:#ffa726; height:3px"></span>300mm&sup2;</div>' +
        '<div class="row"><span class="sw" style="background:#4ade80; height:2px"></span>150mm&sup2;</div>' +
        '<div class="row" style="opacity:0.7"><span class="sw" style="background:#94a3b8; height:2px; opacity:0.5"></span>installed</div>';
      L.DomEvent.disableClickPropagation(div);
      return div;
    };

    // ===== DISCLAIMER ============================================================
    function acknowledgeDisclaimer() {
      document.getElementById('disclaimer-overlay').style.display = 'none';
    }

    // ===== SMALL HELPERS =========================================================
    // escape vessel-supplied text before it goes into HTML
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // "12s ago" / "4m 10s ago" / "1h 3m ago"
    function ago(ms) {
      if (ms == null) return '—';
      var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
      if (s < 60) return s + 's ago';
      var m = Math.floor(s / 60);
      if (m < 60) return m + 'm ' + (s % 60) + 's ago';
      var h = Math.floor(m / 60);
      return h + 'h ' + (m % 60) + 'm ago';
    }

    // ===== VESSEL RENDERING ======================================================
    // Records arrive from /vessels with a numeric report time `t` (already
    // normalized by the server) and an `ais_source` of "aisstream" or "vesselapi".
    // Fallback (vesselapi) fixes are drawn blue and dashed so a paid, possibly
    // stale position is never mistaken for a live track.

    function popupHtml(d) {
      var sourceLine = (d.ais_source && d.ais_source !== 'aisstream')
        ? 'Source: ' + esc(d.ais_source) + '<br>'
        : '';
      return '<b>' + esc(d.name || 'UNKNOWN') + '</b><br>'
        + 'MMSI: ' + d.mmsi + '<br>'
        + 'Speed: ' + (d.sog != null ? d.sog + ' kn' : '—') + '<br>'
        + 'Course: ' + (d.cog != null ? Math.round(d.cog) + '\u00B0' : '—') + '<br>'
        + sourceLine
        + 'Last report: ' + ago(d.t);
    }

    var markers = {};   // mmsi -> Leaflet circleMarker

    function refresh() {
      fetch(DATA_URL)
        .then(function (r) { return r.json(); })
        .then(function (list) {
          var seen = {};
          list.forEach(function (vessel) {
            // skip records without coordinates
            if (vessel.lat == null || vessel.lon == null) return;

            seen[vessel.mmsi] = true;

            // styling: fallback fixes are blue + dashed, targets red, everyone else green
            var isTarget = TARGETS.indexOf(vessel.mmsi) !== -1;
            var isFallback = vessel.ais_source && vessel.ais_source !== 'aisstream';
            var clr = isFallback ? '#8ab4f8' : (isTarget ? '#ff5252' : '#37e8a0');
            var dash = isFallback ? '4 4' : null;

            // strike through the label when the report time is over an hour old
            var nm = vessel.name || String(vessel.mmsi);
            var strike = (Date.now() - vessel.t) > STALE_MS ? 'text-decoration:line-through;' : '';
            var labelColor = (isTarget || isFallback) ? 'color:' + clr + ';' : '';
            var labelSize = isTarget ? 'font-size:14px;font-weight:bold;' : '';
            var displayName = '<span style="' + strike + labelColor + labelSize + '">' + esc(nm) + '</span>';

            if (markers[vessel.mmsi]) {
              markers[vessel.mmsi].setLatLng([vessel.lat, vessel.lon])
                .setPopupContent(popupHtml(vessel))
                .setTooltipContent(displayName)
                .setStyle({ color: clr, fillColor: clr, dashArray: dash });
            } else {
              markers[vessel.mmsi] = L.circleMarker([vessel.lat, vessel.lon],
                { radius: isTarget ? 6 : 4, color: clr, weight: 1, fillColor: clr, fillOpacity: .7, dashArray: dash })
                .addTo(map)
                .bindPopup(popupHtml(vessel))
                .bindTooltip(displayName, { permanent: true, direction: 'top', offset: [0, -4], className: 'ves-label' });
            }
          });

          // remove markers for vessels that aged out of the server's window
          Object.keys(markers).forEach(function (mmsi) {
            if (!seen[mmsi]) { map.removeLayer(markers[mmsi]); delete markers[mmsi]; }
          });

          document.getElementById('count').textContent = list.length;
          document.getElementById('status').textContent = 'updated ' + new Date().toLocaleTimeString();
        })
        .catch(function () { document.getElementById('status').textContent = 'server unreachable'; });
    }

    refresh();
    setInterval(refresh, REFRESH_MS);

    // ===== PROJECT LAYERS (PIN-gated, loaded from Neon Postgres) ==================
    // Tower designations and cable routes that aren't in the public filings live
    // in a read-only Neon DB (role: neondb_viewer, SELECT-only, this table set
    // only). The password is TYPED AT RUNTIME and never committed — only the
    // host/role template below ships to the repo. Honest limitation: once someone
    // loads these layers, the completed connection string is visible in their
    // browser devtools, so treat the password as "shared with everyone you give
    // it to," use a random ~12-char value, and rotate it to revoke access.
    //
    // >>> EDIT host/db here if yours differ (role stays neondb_viewer):
    var PROJECT_CONN = "postgresql://neondb_viewer:__PASSWORD__@ep-lingering-snow-a8trajrb.eastus2.azure.neon.tech/neondb?sslmode=require";

    var projectLayer = L.layerGroup();   // holds everything loaded from the DB
    var projectLoaded = false;

    function showProjPrompt() {
      document.getElementById('proj-form').style.display = 'block';
      document.getElementById('proj-toggle').style.display = 'none';
      document.getElementById('proj-pw').focus();
    }

    function setProjMsg(text, isError) {
      var el = document.getElementById('proj-msg');
      el.textContent = text;
      el.className = isError ? 'err' : '';
    }

    // The queries below convert PostGIS geom -> GeoJSON via ST_AsGeoJSON(geom)
    // AS geojson. GeoJSON uses [lon,lat]; Leaflet wants [lat,lon].
    function coordsToLatLng(coords) {
      return coords.map(function (c) { return [c[1], c[0]]; });
    }

    function parsePoint(value) {
      var g = value;
      if (typeof g === 'string') { try { g = JSON.parse(g); } catch (e) { return null; } }
      if (g && g.type === 'Point' && g.coordinates) return [g.coordinates[1], g.coordinates[0]];
      return null;
    }

    function parseLineString(value) {
      var g = value;
      if (typeof g === 'string') { try { g = JSON.parse(g); } catch (e) { return null; } }
      if (!g) return null;
      if (g.type === 'LineString' && g.coordinates) return coordsToLatLng(g.coordinates);
      if (g.type === 'MultiLineString' && g.coordinates) return g.coordinates.map(coordsToLatLng);
      return null;
    }

    async function loadProjectLayers() {
      if (projectLoaded) return;
      var pw = document.getElementById('proj-pw').value;
      if (!pw) { setProjMsg('enter the password', true); return; }
      setProjMsg('connecting…', false);

      try {
        // Neon's HTTP driver — lets the browser run read queries over HTTPS.
        var mod = await import('https://esm.sh/@neondatabase/serverless@1.1.0');
        var sql = mod.neon(PROJECT_CONN.replace('__PASSWORD__', encodeURIComponent(pw)));

        // two read-only queries; ST_AsGeoJSON turns PostGIS geom into GeoJSON text
        var towersRes = await sql.query('SELECT id, name, type, designation, ST_AsGeoJSON(geom) AS geojson FROM sunrise_wtg_locations');
        var cablesRes = await sql.query('SELECT *, ST_AsGeoJSON(geom) AS geojson FROM cable_status');

        // driver returns either the rows array directly or { rows: [...] }
        var towers = towersRes.rows || towersRes;
        var cables = cablesRes.rows || cablesRes;

        // Log one row of each so you can confirm/adjust column names in devtools.
        if (towers[0]) console.log('sunrise_wtg_locations columns:', Object.keys(towers[0]));
        if (cables[0]) console.log('cable_status columns:', Object.keys(cables[0]));

        renderTowers(towers);
        renderCables(cables);

        // swap the public filing layer out for the project layers
        if (map.hasLayer(publicWtgLayer)) map.removeLayer(publicWtgLayer);
        projectLayer.addTo(map);
        projectLoaded = true;
        cableLegend.addTo(map);
        document.getElementById('proj-form').style.display = 'none';
        setProjMsg('loaded ' + towers.length + ' towers, ' + cables.length + ' cables', false);
      } catch (e) {
        // Wrong password, blocked role, or a schema mismatch all land here.
        console.log('project layer load failed:', e);
        setProjMsg('could not load — check password / connection', true);
      }
    }

    function renderTowers(rows) {
      rows.forEach(function (r) {
        var ll = parsePoint(r.geojson);
        if (!ll) return;
        var label = r.designation || r.name || '?';

        // 150m ring, matching the public layer
        L.circle(ll, { radius: 150, color: '#ffd54f', weight: 0.8, dashArray: '4 4', fillOpacity: 0.03, interactive: false }).addTo(projectLayer);

        L.circleMarker(ll, {
          radius: 4, color: '#ffd54f', weight: 1, fillColor: '#ffd54f', fillOpacity: 0.8
        })
          .bindPopup('<b>' + esc(String(label)) + '</b>'
            + (r.name ? '<br>Name: ' + esc(String(r.name)) : '')
            + (r.type ? '<br>Type: ' + esc(String(r.type)) : ''))
          .bindTooltip(
            '<b>' + esc(String(r.designation || '?')) + '</b>' + (r.name ? '<br>' + esc(String(r.name)) : ''),
            { permanent: true, direction: 'bottom', offset: [0, 4], className: 'ves-label wtg-label' })
          .addTo(projectLayer);
      });
    }

    function cableStyle(r) {
      // installed = done, recede into background
      var done = r.installed === true || r.installed === 't' || r.installed === 'true' || r.installed === 1;
      if (done) return { color: '#94a3b8', weight: 1.6, opacity: 0.45 };

      // regex tolerates "600", "600mm²", "IAC-600", etc.
      var t = String(r.cable_type || '');
      if (/800/.test(t)) return { color: '#ff5252', weight: 3, opacity: 0.95 };
      if (/300/.test(t)) return { color: '#ffa726', weight: 2.4, opacity: 0.95 };
      if (/150/.test(t)) return { color: '#4ade80', weight: 1.8, opacity: 0.95 };

      // unknown size — keep the old purple as a bug canary
      return { color: '#c792ea', weight: 2, opacity: 0.9 };
    }

    function renderCables(rows) {
      rows.forEach(function (r) {
        var line = parseLineString(r.geojson);
        if (!line || line.length < 2) return;
        var title = r.cable_route_ref || r.string_ref || ('cable ' + r.id);
        var pop = '<b>' + esc(String(title)) + '</b>'
          + (r.cable_type ? '<br>Type: ' + esc(String(r.cable_type)) : '')
          + (r.string_ref && r.string_ref !== title ? '<br>String ID: ' + esc(String(r.string_ref)) : '')
          + (r.installed != null ? '<br>Installed: ' + esc(String(r.installed)) : '');
        L.polyline(line, cableStyle(r)).bindPopup(pop).addTo(projectLayer);
      });
    }

    window.replay = function () {
      // Replay reads the history table with the same read-only neondb_viewer role,
      // so it needs the same completed connection string the project layers build.
      var pw = document.getElementById('proj-pw').value;
      if (!pw) { alert('Enter the project password (top-right) first — replay reads the same read-only database.'); return; }
      var conn = PROJECT_CONN.replace('__PASSWORD__', encodeURIComponent(pw));
      import('./replay.js')
        .then(function (mod) { return mod.start({ map: map, L: L, esc: esc, WATCHED: TARGETS, conn: conn }); })
        .catch(function (e) { console.log('replay failed:', e); });
    };

    // ===== TWO-CLICK STRETCH MEASURE (DBL-CLICK TRIGGER) =========================
    var ringCenter = null;
    var activeRing = null;
    var ringTooltip = null;
    var centerDot = null;

    // 1. Disable default double-click zoom so the map stays perfectly still
    map.doubleClickZoom.disable();

    // 2. DOUBLE-CLICK: Anchors the center point and starts the engine
    map.on('dblclick', function (e) {
      if (ringCenter) return; // Safety shield if already drawing

      ringCenter = e.latlng;

      centerDot = L.circleMarker(ringCenter, {
        radius: 3, color: '#00d2ff', fillColor: '#00d2ff', fillOpacity: 1, interactive: false
      }).addTo(map);

      activeRing = L.circle(ringCenter, {
        radius: 0, color: '#00d2ff', weight: 1.5, dashArray: '6 6', fillOpacity: 0.05, interactive: false
      }).addTo(map);

      ringTooltip = L.tooltip({
        permanent: true, direction: 'right', offset: [15, 0], className: 'ves-label'
      }).setLatLng(ringCenter).setContent('00:00 at 10 kts<br>0.00 NM').addTo(map);

      map.on('mousemove', stretchRing);

      // Arm the single-click lock listener after a split second so the current interaction doesn't trip it
      setTimeout(function () {
        map.on('click', lockRing);
      }, 50);
    });

    // 3. SINGLE-CLICK: Freezes the layout to solid green
    function lockRing(e) {
      map.off('mousemove', stretchRing);
      map.off('click', lockRing); // Self-destructs this listener until the next run

      activeRing.setStyle({ dashArray: null, color: '#37e8a0' });
      centerDot.setStyle({ color: '#37e8a0', fillColor: '#37e8a0' });

      // Reset state variables for the next measurement run
      ringCenter = null; activeRing = null; ringTooltip = null; centerDot = null;
    }

    // 4. MOUSE MOVE: Handles real-time telemetry calculations
    function stretchRing(e) {
      if (!ringCenter) return;

      var meters = ringCenter.distanceTo(e.latlng);
      activeRing.setRadius(meters);

      var nm = meters / 1852;

      var totalHours = nm / 10;
      var hrs = Math.floor(totalHours);
      var mins = Math.round((totalHours - hrs) * 60);

      if (mins === 60) { hrs++; mins = 0; }

      var hh = hrs.toString().padStart(2, '0');
      var mm = mins.toString().padStart(2, '0');

      var labelHtml = '<span style="color:#8ab4f8; font-size:13px;">⏱ ' + hh + ':' + mm + ' at 10 kts</span><br>'
        + '<b style="font-size:13px;">' + nm.toFixed(2) + ' NM</b>'
        + '<br><span style="color:#9fdfc8; font-size:11px;">' + Math.round(meters) + ' m</span>';

      ringTooltip.setLatLng(e.latlng).setContent(labelHtml);

    }

  </script>
</body>

</html>
